name: Compilar APK de Aura

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # Los ejecutores de GitHub ya incluyen el Android SDK (ANDROID_HOME).
      - name: Pruebas unitarias y APK de depuración
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publicar informe de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
